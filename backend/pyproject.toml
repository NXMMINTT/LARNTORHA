[project]
name = "larntorha-backend"
version = "0.1.0"
description = "หลานโทรหา backend: Bedrock call analysis, OSM dashboard API, LINE notifications"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "boto3>=1.35",
    "httpx>=0.27",
    "amazon-transcribe>=0.6.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "moto[dynamodb]>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "boto3-stubs[bedrock-runtime,dynamodb]>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Thai text triggers ambiguous-unicode warnings

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
